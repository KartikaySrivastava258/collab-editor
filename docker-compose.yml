# One service: the Go server also serves the built frontend.
#   docker compose up --build     → http://localhost:8080
services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8080"
      # Same-origin pages are always allowed; add other browser origins here.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
    restart: unless-stopped
    stop_grace_period: 15s
